name: Build OpenWrt Honk

# Build the DNS follow core with openwrt-honk's LuCI integration.
on:
  push:
    branches: [build/arm64-follow]
    paths:
      - "crates/**"
      - "ci/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".github/ci/pins.env"
      - ".github/workflows/openwrt-arm64.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openwrt-apk-${{ github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  HONK_VERSION_OVERRIDE: v0.1.0-beta.7
  HONK_TARGET: aarch64-unknown-linux-musl
  FEATURES: ebpf,rprx,clash-api,native-api,jemalloc
  PACKAGING_REVISION: dfc6756ce9099943ddf7e9f588c82083f7e0e0a0

jobs:
  build:
    name: Build patched ARM64 core
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check out the pinned OpenWrt integration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kenzok8/openwrt-honk
          ref: ${{ env.PACKAGING_REVISION }}
          path: integration
          persist-credentials: false

      - name: Apply the OpenWrt config validator and readiness patch
        run: git apply --check integration/ci/patches/honk-core-config-validate.patch && git apply integration/ci/patches/honk-core-config-validate.patch

      - name: Read Rust toolchains
        id: toolchain
        run: |
          set -euo pipefail
          echo "stable=$(grep -oP '^channel\s*=\s*\"\K[^\"]+' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
          echo "ebpf=$(grep -oP '^channel\s*=\s*\"\K[^\"]+' crates/honk-ebpf/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust stable (with target)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.stable }}
          target: ${{ env.HONK_TARGET }}

      - name: Install Rust nightly (for the eBPF object)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.ebpf }}
          components: rust-src, llvm-tools

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: build-${{ env.HONK_TARGET }}-full
          cache-on-failure: true
          workspaces: |
            . -> target
            crates/honk-ebpf -> target

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev pkg-config cmake libclang-dev zstd

      - name: Install pinned bpf-linker
        run: |
          set -euo pipefail
          source .github/ci/pins.env
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/bpf-linker.tar.zst" \
            "https://github.com/aya-rs/bpf-linker/releases/download/v$BPF_LINKER_VERSION/bpf-linker-x86_64-unknown-linux-musl.tar.zst"
          echo "$BPF_LINKER_SHA256  $RUNNER_TEMP/bpf-linker.tar.zst" | sha256sum -c -
          zstd -dc "$RUNNER_TEMP/bpf-linker.tar.zst" | tar -xf - -C "$CARGO_HOME/bin"
          bpf-linker --version

      # The eBPF object is target-independent; build it once on the host so
      # the cross build just picks it up (build.rs locates it when present).
      - name: Build eBPF object
        run: |
          set -euo pipefail
          cd crates/honk-ebpf
          cargo build --release -Zbuild-std=core --target bpfel-unknown-none

      # aya refuses objects without BTF ("no BTF parsed for object") — fail
      # the build here instead of at runtime on a gateway.
      - name: Verify eBPF object has BTF
        run: readelf -S crates/honk-ebpf/target/bpfel-unknown-none/release/honk-ebpf | grep '\.BTF' > /dev/null

      # boring-sys (BoringSSL, C++) needs a clang-compatible target toolchain:
      # under cross compilation CMake injects clang-style --target flags into
      # boring-sys' ASM rules that real GCC rejects, and zig rejects the Rust
      # triple spelling — ci/zigcc / ci/zigcxx strip those flags and re-anchor
      # on the zig-style target in $ZIGCC_TARGET.
      - name: Install zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.14.1

      - name: Build honk-core (cross via zig wrappers)
        run: |
          set -euo pipefail
          T="$HONK_TARGET"
          export ZIGCC_TARGET="${T/-unknown/}"
          # cc crate wants lowercase CC_<target_with_underscores>; cargo
          # wants uppercase CARGO_TARGET_<TARGET>.
          L=$(printf '%s' "$T" | tr '-' '_')
          U=$(printf '%s' "$T" | tr 'a-z-' 'A-Z_')
          eval "export CC_${L}=\$PWD/ci/zigcc"
          eval "export CXX_${L}=\$PWD/ci/zigcxx"
          eval "export CARGO_TARGET_${U}_LINKER=\$PWD/ci/zigcc"
          # musl: let zig supply the CRT (Rust's self-contained rcrt1.o and
          # zig's crt1.o both define _start).
          eval "export CARGO_TARGET_${U}_RUSTFLAGS='-C link-self-contained=no'"
          # boring-sys generates its bindings with bindgen at build time —
          # point it at zig's target headers, not the host's.
          BINDGEN_EXTRA_CLANG_ARGS="$(ci/zig-bindgen-env "$ZIGCC_TARGET")"
          export BINDGEN_EXTRA_CLANG_ARGS
          cargo build --release -p honk-core --no-default-features --features "$FEATURES" --target "$T"

      - name: Create the SDK source archive
        run: |
          set -euo pipefail
          name=honk-core-aarch64-openwrt
          mkdir -p "dist/$name"
          cp "target/$HONK_TARGET/release/honk-core" LICENSE "dist/$name/"
          LC_ALL=C readelf -h "dist/$name/honk-core" | grep -E 'Machine:[[:space:]]+AArch64$'
          tar -czf "$name.tar.gz" -C dist "$name"
          sha256sum "$name.tar.gz" > core.SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openwrt-arm64-core-source
          path: |
            honk-core-aarch64-openwrt.tar.gz
            core.SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  package:
    name: Build Cortex-A53 OpenWrt APKs
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out the pinned package recipes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kenzok8/openwrt-honk
          ref: ${{ env.PACKAGING_REVISION }}
          path: integration
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openwrt-arm64-core-source
          path: core

      - name: Prepare the OpenWrt feed
        run: |
          set -euo pipefail
          feed="$GITHUB_WORKSPACE/feed"
          mkdir -p "$feed/dl" "$GITHUB_WORKSPACE/sdk-output"
          cp -a integration/{honk,luci-app-honk} "$feed/"
          (cd core && sha256sum -c core.SHA256SUMS)
          cp core/honk-core-aarch64-openwrt.tar.gz "$feed/dl/"
          hash=$(cut -d' ' -f1 core/core.SHA256SUMS)
          {
            printf 'CORE_COMMIT:=%s\n' "$GITHUB_SHA"
            printf 'HONK_ASSET_AARCH64:=honk-core-aarch64-openwrt.tar.gz\n'
            printf 'HONK_HASH_AARCH64:=%s\n' "$hash"
            printf 'PKG_SOURCE_URL:=file:///feed/dl/\n'
          } > "$feed/honk/generated-stage.mk"
          sed -i \
            -e 's/^PKG_RELEASE:=2$/PKG_RELEASE:=3/' \
            -e 's/^PKG_LICENSE:=AGPL-3.0-only$/PKG_LICENSE:=GPL-3.0-only/' \
            "$feed/honk/Makefile"
          patch_hash=$(sha256sum integration/ci/patches/honk-core-config-validate.patch | cut -d' ' -f1)
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg commit "$GITHUB_SHA" \
            --arg integration "$PACKAGING_REVISION" --arg hash "$hash" \
            --arg patch "$patch_hash" --arg version "$HONK_VERSION_OVERRIDE" --arg features "$FEATURES" \
            '{core:{repository:$repository,commit:$commit,version:$version,lane:"arm64-follow",features:$features,architectures:["aarch64"],configuration_patch_sha256:$patch}, integration_commit:$integration,core_archive_sha256:$hash}' \
            > "$feed/honk/generated-provenance.json"
          jq -e --arg commit "$GITHUB_SHA" '.core.commit == $commit' "$feed/honk/generated-provenance.json"

      - name: Check out the project's pinned SDK action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kenzok8/gh-action-sdk
          ref: 44f98c51d04aebd1aa79fe4f603559c1ec2085da
          path: .sdk-action
          persist-credentials: false

      - name: Build honk and luci-app-honk with SDK 25.12
        uses: ./.sdk-action
        env:
          CONTAINER: immortalwrt/sdk
          ARCH: aarch64_cortex-a53-openwrt-25.12
          FEEDNAME: honk
          FEED_DIR: ${{ github.workspace }}/feed
          ARTIFACTS_DIR: ${{ github.workspace }}/sdk-output
          PACKAGES: honk luci-app-honk
          EXTRA_FEEDS: src-git|wall|https://github.com/kenzok8/wall
          NO_REFRESH_CHECK: 'true'
          NO_SHFMT_CHECK: '1'
          IGNORE_ERRORS: 'false'

      - name: Collect both APKs
        run: |
          set -euo pipefail
          mkdir -p dist
          for package in honk luci-app-honk; do
            mapfile -t files < <(find sdk-output/bin/packages/aarch64_cortex-a53/honk \
              -maxdepth 1 -type f -size +0c -name "$package-*.apk" -print)
            test "${#files[@]}" -eq 1
            cp "${files[0]}" dist/
          done
          (cd dist && sha256sum ./*.apk > SHA256SUMS)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openwrt-honk-aarch64-cortex-a53
          path: dist/
          if-no-files-found: error
          retention-days: 30
